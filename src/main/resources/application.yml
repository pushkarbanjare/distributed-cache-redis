spring:
  application:
    name: distributed-cache-redis
  data:
    redis:
      host: localhost
      port: 6379
  datasource:
    url: jdbc:postgresql://localhost:5432/distributed_cache
    username: cache_app
    password: cache_app_pass
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8080
